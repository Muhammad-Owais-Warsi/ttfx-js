name: Deprecate once
# One-off: deprecate the abandoned ttfx-cli name. Delete this file after use.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: "npm deprecate ttfx-cli@0.3.2-win.1 'Renamed to ttfx-js - install with npm i ttfx-js'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

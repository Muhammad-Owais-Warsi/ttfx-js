name: Node API

on:
  workflow_dispatch:
    inputs:
      ttfx_ref:
        description: "Fork tag/branch to build (empty = .ttfx-ref file)"
        default: ""
        required: false
      publish:
        description: "Publish to npm (false = artifacts only)"
        default: "false"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    name: Resolve engine tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          if [ -n "${{ inputs.ttfx_ref }}" ]; then
            echo "tag=${{ inputs.ttfx_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(cat .ttfx-ref)" >> "$GITHUB_OUTPUT"
          fi
      - run: "node -e \"console.log('engine tag: ${{ steps.ref.outputs.tag }}')\""

  build:
    name: Build (${{ matrix.pkg }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ttfx-node-linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            fulltest: true
            artifact: index.linux-x64-gnu.node
          - pkg: ttfx-node-linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: index.linux-x64-musl.node
            fulltest: false
            musl: true
          - pkg: ttfx-node-darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            fulltest: true
            artifact: index.darwin-x64.node
          - pkg: ttfx-node-darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            fulltest: true
            artifact: index.darwin-arm64.node
          - pkg: ttfx-node-windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: index.win32-x64-msvc.node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # npm install (not ci): the optional platform deps don't exist on the
      # registry until first publish, and only ci treats that as fatal.
      - run: npm install --no-audit --no-fund
        working-directory: native
      - run: npx napi build --platform --target ${{ matrix.target }} --release
        working-directory: native
      - run: |
          node -e "
            const b = require('./${{ matrix.artifact }}');
            const assert = require('node:assert/strict');
            assert.equal(b.listEffects().length, 37);
            const a = b.getFrames('hello', 'decrypt', { seed: 1 });
            assert.deepEqual(a, b.getFrames('hello', 'decrypt', { seed: 1 }));
            console.log('smoke OK', a.length, 'frames');
          "
        working-directory: native
      - run: node test.mjs
        if: matrix.fulltest
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: native/${{ matrix.artifact }}

  sync-gate:
    name: Sync gate (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ttfx
          - os: windows-latest
            exe: ttfx.exe
    steps:
      - uses: actions/checkout@v4
        with:
          path: ttfx-js
      - uses: actions/checkout@v4
        with:
          repository: Muhammad-Owais-Warsi/ttfx
          ref: ${{ needs.setup.outputs.tag }}
          path: ttfx-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: grep -q "tag = \"${{ needs.setup.outputs.tag }}\"" ttfx-js/native/Cargo.toml
        shell: bash
      - run: cargo build --release
        working-directory: ttfx-src
      - run: npm install --no-audit --no-fund
        working-directory: ttfx-js/native
      - run: npx napi build --platform
        working-directory: ttfx-js/native
      - run: node ttfx-js/native/sync-gate.mjs "ttfx-src/target/release/${{ matrix.exe }}"
        shell: bash

  wasm:
    name: Build (wasm)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ttfx-js
      - uses: actions/checkout@v4
        with:
          repository: Muhammad-Owais-Warsi/ttfx
          ref: ${{ needs.setup.outputs.tag }}
          path: ttfx-src
      # The installer script ships wasm-pack 0.13.x, whose wasm-bindgen emits a
      # glue Node 24 rejects at instantiation. 0.15.0 is what the local smoke
      # passed against.
      - run: cargo install wasm-pack --version 0.15.0 --locked
      # Pinned: newer rustc emits wasm features this Node's validator rejects
      # (traps at instantiation). 1.95.0 is what the local smoke passed on.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: node --version; rustc --version; wasm-pack --version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The fork manifest stays rlib (a cdylib there collides on macOS
      # `cargo test`); the wasm build opts into cdylib locally, as upstream
      # documents for its own wasm builds.
      - run: sed -i 's/crate-type = \["rlib"\]/crate-type = ["cdylib", "rlib"]/' Cargo.toml
        working-directory: ttfx-src
      # wasm-opt's bundled validator rejects the bulk-memory ops current
      # rustc emits (both sides fail the same way); ship unoptimized until
      # the toolchain pair agrees again. No fork change needed.
      - run: printf '\n[package.metadata.wasm-pack.profile.release]\nwasm-opt = false\n' >> Cargo.toml
        working-directory: ttfx-src
      - run: wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/wasm-pkg" --out-name ttfx_wasm
        working-directory: ttfx-src
      # Drive the real artifact headlessly like omarchy.org's etch.js does:
      # Session + step + fill, determinism, palette, error paths.
      - run: node ttfx-js/native/web-test.mjs "$GITHUB_WORKSPACE/wasm-pkg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttfx-wasm-pkg
          path: wasm-pkg/ttfx_wasm*

  publish:
    name: Publish to npm
    needs: [setup, build, wasm]
    if: inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ttfx-js
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: |
          node -e "
            const assert = require('node:assert/strict');
            const v = require('./ttfx-js/versions.json');
            const main = require('./ttfx-js/native/package.json');
            assert.equal(main.version, v.nodeVersion, 'native != versions.json');
            for (const [name, ver] of Object.entries(main.optionalDependencies)) {
              const p = require('./ttfx-js/packages/' + name + '/package.json');
              assert.equal(p.version, ver, name + ' != native optionalDependencies');
            }
            assert.equal('${{ needs.setup.outputs.tag }}', v.ttfxTag, 'tag != versions.json');
            console.log('versions OK', JSON.stringify(v));
          "
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: bins
      - run: |
          for spec in \
            "ttfx-node-linux-x64-gnu:index.linux-x64-gnu.node" \
            "ttfx-node-linux-x64-musl:index.linux-x64-musl.node" \
            "ttfx-node-darwin-x64:index.darwin-x64.node" \
            "ttfx-node-darwin-arm64:index.darwin-arm64.node" \
            "ttfx-node-windows-x64:index.win32-x64-msvc.node"; do
            pkg="${spec%%:*}"
            file="${spec##*:}"
            cp "bins/$pkg/$file" "ttfx-js/packages/$pkg/$file"
          done
        shell: bash
      - run: |
          mkdir -p ttfx-js/native/wasm
          cp bins/ttfx-wasm-pkg/ttfx_wasm.js bins/ttfx-wasm-pkg/ttfx_wasm.d.ts bins/ttfx-wasm-pkg/ttfx_wasm_bg.wasm bins/ttfx-wasm-pkg/ttfx_wasm_bg.wasm.d.ts ttfx-js/native/wasm/
          ls ttfx-js/native/wasm
        shell: bash
      - run: |
          for dir in ttfx-node-linux-x64-gnu ttfx-node-linux-x64-musl ttfx-node-darwin-x64 ttfx-node-darwin-arm64 ttfx-node-windows-x64; do
            pkg=$(node -p "require('./ttfx-js/packages/$dir/package.json').name")
            ver=$(node -p "require('./ttfx-js/packages/$dir/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "$pkg@$ver already published, skipping publish"
            else
              npm publish --provenance --access public --tag next "ttfx-js/packages/$dir"
            fi
            npm dist-tag add "$pkg@$ver" latest
          done
          pkg=$(node -p "require('./ttfx-js/native/package.json').name")
          ver=$(node -p "require('./ttfx-js/native/package.json').version")
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver already published, skipping publish"
          else
            npm publish --provenance --access public --tag next ./ttfx-js/native
          fi
          npm dist-tag add "$pkg@$ver" latest
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
